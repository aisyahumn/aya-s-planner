<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aya's Planner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f8eeee;
      color: #5a4b4b;
    }

    .landing {
      width: 100%;
      max-width: 430px;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 55px 25px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(100, 70, 70, 0.12);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.7;
      color: #8b7777;
      margin-bottom: 35px;
    }

    .open-btn {
      display: inline-block;
      padding: 15px 30px;
      border-radius: 15px;
      background: #e9bfc9;
      color: #5a4045;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .open-btn:hover {
      transform: translateY(-3px);
      background: #e2aeba;
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #aa9696;
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="icon">🎀</div>

    <h1>Aya's Planner</h1>

    <p class="subtitle">
      A little space for my plans,<br>
      goals and reminders ✨
    </p>

    <a href="planner.html" class="open-btn">
      Open My Planner →
    </a>

    <p class="footer">
      Made for Aya 💗
    </p>

  </main>

</body>
</html>
