
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aya's Planner</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f8eeee;padding:18px;color:#5a4b4b}
.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 3px 10px rgba(0,0,0,.08)}
h1{text-align:center}
textarea,input{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{background:#f4d6df;border:none;padding:10px 14px;border-radius:12px}
</style>
</head>
<body>
<h1>🎀 Aya's Planner</h1>

<div class="card">
<h3>📅 Event Paling Dekat</h3>
<input id="event" placeholder="Contoh: Teachers Bonding">
</div>

<div class="card">
<h3>✅ To Do Hari Ini</h3>
<textarea id="today" rows="5"></textarea>
</div>

<div class="card">
<h3>📆 To Do Mingguan</h3>
<textarea id="weekly" rows="5"></textarea>
</div>

<div class="card">
<h3>💭 Soalan Nak Tanya Siapa</h3>
<textarea id="ask" rows="5"></textarea>
</div>

<div class="card">
<h3>💰 Petty Cash / PV</h3>
<textarea id="money" rows="5"></textarea>
</div>

<div class="card">
<h3>🏨 Sales Bilik</h3>
<input id="sales" placeholder="RM">
</div>

<div class="card">
<button onclick="saveData()">💗 Save Planner</button>
<p id="status"></p>
</div>

<script>
function saveData(){
 localStorage.setItem('event',event.value);
 localStorage.setItem('today',today.value);
 localStorage.setItem('weekly',weekly.value);
 localStorage.setItem('ask',ask.value);
 localStorage.setItem('money',money.value);
 localStorage.setItem('sales',sales.value);
 status.innerText='Saved ✨';
}
window.onload=()=>{
 event.value=localStorage.getItem('event')||'';
 today.value=localStorage.getItem('today')||'';
 weekly.value=localStorage.getItem('weekly')||'';
 ask.value=localStorage.getItem('ask')||'';
 money.value=localStorage.getItem('money')||'';
 sales.value=localStorage.getItem('sales')||'';
}
</script>
</body>
</html>
